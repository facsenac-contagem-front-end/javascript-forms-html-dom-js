<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno | UC4 Front-end</title>

  <!-- Fontes: Lexend (texto), JetBrains Mono (código) e Caveat (anotação) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=JetBrains+Mono:wght@400;500&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="pagina">

    <!-- Topo -->
    <div class="topo">
      <div class="topo__marca">Cadastro de Aluno<span class="cursor"></span></div>
      <div class="topo__info">UC4 · Desenvolvimento Front-end</div>
    </div>

    <!-- Conteúdo -->
    <div class="conteudo">

      <div class="intro">
        <h1>Cadastro de aluno</h1>
        <p>Preencha seus dados para entrar na turma.</p>
      </div>

      <div class="colunas">

        <!-- PARTE 1: monte o formulário aqui dentro -->
        <div id="app" class="cartao">

          <form id="form-aluno" novalidate>

            <fieldset>
              <legend>Dados do aluno</legend>

              <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
              </div>

              <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="voce@exemplo.com">
              </div>

              <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres">
              </div>

              <div class="campo">
                <label for="curso">Curso</label>
                <select id="curso" name="curso">
                  <option value="">Selecione um curso</option>
                  <option value="Análise e Desenvolvimento de Sistemas">Análise e Desenvolvimento de Sistemas</option>
                  <option value="Ciência da Computação">Ciência da Computação</option>
                  <option value="Sistemas de Informação">Sistemas de Informação</option>
                  <option value="Design Gráfico">Design Gráfico</option>
                </select>
              </div>

              <div class="campo">
                <label>Turno</label>
                <div class="opcoes">
                  <div class="opcao">
                    <input type="radio" id="turno-manha" name="turno" value="Manhã">
                    <label for="turno-manha">Manhã</label>
                  </div>
                  <div class="opcao">
                    <input type="radio" id="turno-tarde" name="turno" value="Tarde">
                    <label for="turno-tarde">Tarde</label>
                  </div>
                  <div class="opcao">
                    <input type="radio" id="turno-noite" name="turno" value="Noite">
                    <label for="turno-noite">Noite</label>
                  </div>
                </div>
              </div>

              <div class="opcao">
                <input type="checkbox" id="termos" name="termos">
                <label for="termos">Li e aceito as regras da turma</label>
              </div>
            </fieldset>

            <p id="mensagem" class="mensagem"></p>

            <div class="botoes">
              <button type="button" id="btn-cadastrar">Cadastrar</button>
              <button type="reset">Limpar</button>
            </div>

          </form>

        </div>

        <!-- PARTE 2: o DOM vai criar os itens desta lista -->
        <div id="resultado" class="cartao cartao--resultado">
          <h2>Alunos cadastrados</h2>
          <p id="lista-vazia" class="vazio">Nenhum aluno cadastrado ainda. Os novos aparecem aqui.</p>
          <ul id="lista-alunos" class="lista-alunos"></ul>
        </div>

      </div>

    </div>

    <!-- Rodapé -->
    <div class="rodape">
      Profa. Ma. Tamara Simões · Faculdade Senac Contagem
    </div>

  </div>

  <!-- O script fica no final do body: assim o HTML já existe quando o JS roda -->
  <script src="script.js"></script>
</body>
</html>
