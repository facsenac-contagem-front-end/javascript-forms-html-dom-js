<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno | UC4 Front-end</title>

  <!-- Fontes: Lexend (texto), JetBrains Mono (código) e Caveat (anotação) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=JetBrains+Mono:wght@400;500&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="pagina">

    <!-- Topo -->
    <div class="topo">
      <div class="topo__marca">Cadastro de Aluno<span class="cursor"></span></div>
      <div class="topo__info">UC4 · Desenvolvimento Front-end</div>
    </div>

    <!-- Conteúdo -->
    <div class="conteudo">

      <div class="intro">
        <h1>Cadastro de aluno</h1>
        <p>Preencha seus dados para entrar na turma.</p>
      </div>

      <div class="colunas">

        <!-- PARTE 1: monte o formulário aqui dentro -->
        <div id="app" class="cartao">

          <!-- Seu <form> vai aqui -->
            <form >
              <fieldset>
                <legend>Dados Pessoas</legend>
                <label for="">Nome Completo</label>
                <input type="text" placeholder="Ex.: Ana Souza" required>
                <label for="">E-mail</label>
                <input type="email" placeholder="Ex.: ana@gmail.com" required>
              </fieldset>
              <fieldset class="options">
                <legend>Turno</legend>
                <input type="radio" name="turno" id="manha" required>
                <label for="manha">Manhã</label>
                <input type="radio" name="turno" id="tarde" required>
                <label for="tarde">Tarde</label>
                <input type="radio" name="turno" id="noite" required>
                <label for="noite">Noite</label>
              </fieldset>
              <fieldset class="options">
                <input type="checkbox" name="" id="temos" required>
                <label for="termos">Li e aceito as regras da turma </label>
              </fieldset>
                <button class="botao-principal">Cadastrar</button>
              <button>limpar</button>
            </form>
        </div>

        <!-- PARTE 2: o DOM vai criar os itens desta lista -->
        <div id="resultado" class="cartao cartao--resultado">
          <h2>Alunos cadastrados</h2>
          <p id="lista-vazia" class="vazio">Nenhum aluno cadastrado ainda. Os novos aparecem aqui.</p>
          <ul id="lista-alunos" class="lista-alunos"></ul>
        </div>

      </div>

    </div>

    <!-- Rodapé -->
    <div class="rodape">
      Profa. Ma. Tamara Simões · Faculdade Senac Contagem
    </div>

  </div>

  <!-- O script fica no final do body: assim o HTML já existe quando o JS roda -->
  <script src="script.js"></script>
</body>
</html>
