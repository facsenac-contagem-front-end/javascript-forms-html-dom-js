<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno | UC4 Front-end</title>

  <!-- Fontes: Lexend (texto), JetBrains Mono (código) e Caveat (anotação) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=JetBrains+Mono:wght@400;500&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="pagina">

    <!-- Topo -->
    <div class="topo">
      <div class="topo__marca">Cadastro de Aluno<span class="cursor"></span></div>
      <div class="topo__info">UC4 · Desenvolvimento Front-end</div>
    </div>

    <!-- Conteúdo -->
    <div class="conteudo">

      <div class="intro">
        <h1>Cadastro de aluno</h1>
        <p>Preencha seus dados para entrar na turma.</p>
      </div>

      <div class="colunas">

        <!-- PARTE 1: monte o formulário aqui dentro -->
        <div id="app" class="cartao">

        <form>
          <fieldset>
          <legend>Dados do aluno</legend>
          <label for="nome">Nome completo:</label>
          <input type="text" placeholder="Ex: Simão Pedro" id="nome" name="nome" required>
          <label for="email">Email:</label>
          <input type="email" placeholder="Ex: pedro@apostolo.com" id="email" name="email" required>
          </fieldset>
          <fieldset>
            <legend>Turno</legend>
            <label for="turno-manha">Manhã</label>
            <input type="radio" id="turno-manha" name="turno" value="manha">
            <label for="turno-tarde">Tarde</label>
            <input type="radio" id="turno-tarde" name="turno" value="tarde">
            <label for="turno-noite">Noite</label>
            <input type="radio" id="turno-noite" name="turno" value="noite" disabled>
            <label for="turno-integral">Integral</label>
            <input type="radio" id="turno-integral" name="turno" value="integral" disabled>
          <fieldset>

          <input type="checkbox" id="termos" name="termos" required>
           <label for="termos">Li e aceito os termos de uso</label>
          <button class="botao-principal" type="submit" id="botao-cadastrar">Cadastrar</button>
          <button type="reset" id="botao-limpar">Limpar</button>
        </form>
        </div>

        <!-- PARTE 2: o DOM vai criar os itens desta lista -->
        <div id="resultado" class="cartao cartao--resultado">
          <h2>Alunos cadastrados</h2>
          <p id="lista-vazia" class="vazio">Nenhum aluno cadastrado ainda. Os novos aparecem aqui.</p>
          <ul id="lista-alunos" class="lista-alunos"></ul>
        </div>

      </div>

    </div>

    <!-- Rodapé -->
    <div class="rodape">
      Leandro Fernandes Barbosa · Faculdade Senac Contagem
    </div>

  </div>

  <!-- O script fica no final do body: assim o HTML já existe quando o JS roda -->
  <script src="script.js"></script>
</body>
</html>
