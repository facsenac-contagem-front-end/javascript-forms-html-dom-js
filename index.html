<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno | UC4 Front-end</title>

  <!-- Fontes: Lexend (texto), JetBrains Mono (código) e Caveat (anotação) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=JetBrains+Mono:wght@400;500&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="pagina">

    <!-- Topo -->
    <div class="topo">
      <div class="topo__marca">Cadastro de Aluno<span class="cursor"></span></div>
      <div class="topo__info">UC4 · Desenvolvimento Front-end</div>
    </div>

    <!-- Conteúdo -->
    <div class="conteudo">

      <div class="intro">
        <h1>Cadastro de aluno</h1>
        <p>Preencha seus dados para entrar na turma.</p>
      </div>

      <div class="colunas">

        <!-- PARTE 1: monte o formulário aqui dentro -->
        <div id="app" class="cartao">

          <!-- Seu <form> vai aqui -->
       <form>
 
   
        <fieldset>
    <legend>Dados Pessoais</legend>
    <label for="">Nome Completo</label>
    <input type="text" placeholder="Ana Souza">
    <label for="">Digite seu email</label>
    <input type="email" placeholder="email@.com.br">
  
  </fieldset> 
 
  <fieldset class="options">
   
    <legend>Turno</legend>
   
    <input type="radio" name="Turno" id="Manhã">
    <label for="">Manhã</label>
    
    <input type="radio" name="Turno" id="Tarde">
    <label for="">Tarde</label>
    
    <input type="radio" name="Turno" id="Noite">
    <label for="">Noite</label>
 
  </fieldset>
  
  <input type="checkbox" name="" id="termos" required>
  
  <label for="">Li e aceito os termos da turma</label>

  <button class="botao-principal">Cadastro</button>

  <button>
    Limpar
  </button>

</form>

        </div>

        <!-- PARTE 2: o DOM vai criar os itens desta lista -->
        <div id="resultado" class="cartao cartao--resultado">
          <h2>Alunos cadastrados</h2>
          <p id="lista-vazia" class="vazio">Nenhum aluno cadastrado ainda. Os novos aparecem aqui.</p>
          <ul id="lista-alunos" class="lista-alunos"></ul>
        </div>

      </div>

    </div>

    <!-- Rodapé -->
    <div class="rodape">
      Profa. Ma. Tamara Simões · Faculdade Senac Contagem
    </div>

  </div>

  <!-- O script fica no final do body: assim o HTML já existe quando o JS roda -->
  <script src="script.js"></script>
</body>
</html>
